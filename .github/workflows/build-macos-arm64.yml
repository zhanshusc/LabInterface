name: Build macOS Apple Silicon app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build native ARM64 application
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: LabInterfaceApp

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install ARM64 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          architecture: arm64
          cache: pip
          cache-dependency-path: LabInterfaceApp/requirements-build.txt

      - name: Verify runner architecture
        run: |
          test "$(uname -m)" = "arm64"
          python -c "import platform; assert platform.machine() == 'arm64', platform.machine()"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip check

      - name: Verify application imports
        run: |
          python -B -c "import lab_interface; from imports.TAExperiment import TAExperiment; from imports.SolitonTAExperimentSelfContained import SolitonTAExperimentSelfContained; print('Application imports passed')"

      - name: Build and validate the application
        run: bash build_macos_arm64.sh

      - name: Upload packaged application
        uses: actions/upload-artifact@v7
        with:
          name: LabInterface-macOS-arm64
          path: LabInterfaceApp/dist/LabInterface-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 30
